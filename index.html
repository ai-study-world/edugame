<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼小衔接 · 趣味学习乐园</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===== 分类首页 ===== -->
<div id="menuScreen" class="screen active">
  <div class="sky">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>
  <h1 class="title">🌈 趣味学习乐园</h1>
  <p class="subtitle">幼小衔接 · 边玩边学 · 共 21 个趣味小游戏</p>
  <div class="star-total">⭐ 我的星星：<span id="totalStars">0</span></div>

  <!-- 分类入口 -->
  <div class="category-grid">
    <a class="category-card cat-preschool" href="preschool.html">
      <div class="category-emoji">🧸</div>
      <div class="category-name">幼儿学习启蒙</div>
      <div class="category-desc">适合 3-5 岁</div>
      <div class="category-games">数数 · 颜色 · 动物叫声 · 找不同 · 行为判断 …</div>
      <div class="category-btn">进入学习 →</div>
    </a>
    <a class="category-card cat-primary" href="primary.html">
      <div class="category-emoji">🎒</div>
      <div class="category-name">幼小衔接教学</div>
      <div class="category-desc">适合 5-7 岁</div>
      <div class="category-games">口算 · 拼音 · 汉字 · 钟表 · 人民币 · 古诗 …</div>
      <div class="category-btn">进入学习 →</div>
    </a>
  </div>

  <div class="menu-actions">
    <button class="btn report-btn" id="reportBtn">📊 家长学习报告</button>
    <button class="btn reset-btn" id="resetBtn">🔄 重置星星</button>
  </div>
</div>

<!-- ===== 家长学习报告屏 ===== -->
<div id="reportScreen" class="screen">
  <div class="game-topbar">
    <button class="btn back-btn" id="reportBackBtn">← 返回首页</button>
    <div class="game-title">📊 家长学习报告</div>
    <div class="game-score">⭐ <span id="reportTotalStars">0</span></div>
  </div>
  <div class="report-summary" id="reportSummary"></div>
  <div class="report-body">
    <div class="report-panel">
      <div class="report-panel-title">能力雷达图</div>
      <canvas id="radarCanvas" width="360" height="300"></canvas>
      <div class="radar-legend" id="radarLegend"></div>
    </div>
    <div class="report-panel">
      <div class="report-panel-title">各游戏表现</div>
      <div class="report-list" id="reportList"></div>
    </div>
  </div>
  <div class="report-actions">
    <button class="btn ghost-btn" id="reportResetBtn">🗑️ 清除全部记录</button>
  </div>
</div>

<!-- ===== 游戏容器（首页不直接用，但保留以防万一） ===== -->
<div id="gameScreen" class="screen">
  <div class="game-topbar">
    <button class="btn back-btn" id="backBtn">← 返回</button>
    <div class="game-title" id="gameTitle"></div>
    <div class="game-score">⭐ <span id="gameStars">0</span></div>
  </div>
  <div id="gameArea"></div>
</div>

<!-- ===== 弹窗 ===== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <button class="btn primary-btn" id="modalBtn">再来一局</button>
    <button class="btn ghost-btn" id="modalBackBtn">返回首页</button>
  </div>
</div>

<!-- 音效 -->
<audio id="snd-correct" preload="auto"></audio>
<audio id="snd-wrong" preload="auto"></audio>
<audio id="snd-win" preload="auto"></audio>
<audio id="snd-click" preload="auto"></audio>

<script src="game.js"></script>
</body>
</html>
